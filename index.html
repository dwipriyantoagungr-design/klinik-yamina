<script>
const YAM_KEY='klinik-yamina-v3-autosave';
const yamGet=()=>{try{return JSON.parse(localStorage.getItem(YAM_KEY)||'{}')}catch(e){return{}}};
const yamSave=(d)=>{d.lastSaved=new Date().toISOString();localStorage.setItem(YAM_KEY,JSON.stringify(d));};
const yamReload=()=>{setTimeout(()=>location.reload(),250)};
const yamDL=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const yamEsc=(s)=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function yamParseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c=='"')q=true; else if(c==','){row.push(cur);cur=''} else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur=''} else if(c!='\r')cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.some(x=>String(x).trim()!=='')).map(r=>{const o={};head.forEach((h,i)=>o[h]=String(r[i]??'').trim());return o});
}
function yamToCSV(rows){
  if(!rows.length)return '';
  const head=Object.keys(rows[0]);
  const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  return '\ufeff'+[head.join(','),...rows.map(r=>head.map(h=>esc(r[h])).join(','))].join('\n');
}
function yamSheets(d){
  const coaMap={};(d.coa||[]).forEach(c=>coaMap[c.kode]=c.nama);
  const jurnal=[];
  (d.saldoAwal||[]).forEach(x=>{if(x.debet)jurnal.push({tanggal:'2024-01-01',noBukti:'SA-AWAL',uraian:x.keterangan||'Saldo Awal',kodeDebet:x.kodeAkun,kodeKredit:'',jumlah:x.debet});if(x.kredit)jurnal.push({tanggal:'2024-01-01',noBukti:'SA-AWAL',uraian:x.keterangan||'Saldo Awal',kodeDebet:'',kodeKredit:x.kodeAkun,jumlah:x.kredit})});
  (d.km||[]).forEach(x=>jurnal.push({tanggal:x.tanggal,noBukti:x.noBukti,uraian:x.uraian,kodeDebet:x.kodeKas,kodeKredit:x.kodeAkun,jumlah:x.jumlah}));
  (d.kk||[]).forEach(x=>jurnal.push({tanggal:x.tanggal,noBukti:x.noBukti,uraian:x.uraian,kodeDebet:x.kodeAkun,kodeKredit:x.kodeKas,jumlah:x.jumlah}));
  (d.bu||[]).forEach(x=>jurnal.push({tanggal:x.tanggal,noBukti:x.noBukti,uraian:x.uraian,kodeDebet:x.kodeDebet||'',kodeKredit:x.kodeKredit||'',jumlah:x.jumlah}));
  return {
    'COA':(d.coa||[]).map(c=>({kode:c.kode,nama:c.nama,kelompok:c.kelompok,jenis:c.jenis,kas:c.kas?'YA':'TIDAK'})),
    'Saldo Awal':(d.saldoAwal||[]).map(x=>({kodeAkun:x.kodeAkun,debet:x.debet||0,kredit:x.kredit||0,keterangan:x.keterangan||''})),
    'Kas Masuk':(d.km||[]).map(x=>({tanggal:x.tanggal,noBukti:x.noBukti,diterimaDari:x.diterimaDari||'',noRM:x.noRM||x.rm||'',uraian:x.uraian,kodeKas:x.kodeKas,kodeAkun:x.kodeAkun,jumlah:x.jumlah,metode:x.metode||'Tunai',petugas:x.petugas||'Admin'})),
    'Kas Keluar':(d.kk||[]).map(x=>({tanggal:x.tanggal,noBukti:x.noBukti,uraian:x.uraian,kodeKas:x.kodeKas,kodeAkun:x.kodeAkun,jumlah:x.jumlah})),
    'Bukti Umum':(d.bu||[]).map(x=>({tanggal:x.tanggal,noBukti:x.noBukti,uraian:x.uraian,kodeDebet:x.kodeDebet||'',kodeKredit:x.kodeKredit||'',jumlah:x.jumlah})),
    'Jurnal':jurnal,
    'Logbook':(d.logs||[]).map(x=>({timestamp:x.timestamp,action:x.action,module:x.module,noBukti:x.noBukti,description:x.description,petugas:x.petugas||''}))
  };
}
function yamExportExcel(){
  const mod=document.getElementById('yam-mod').value;
  const d=yamGet(); const sheets=yamSheets(d);
  const chosen=mod==='Semua'?sheets:{[mod]:sheets[mod]};
  let xml='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#0D9488" ss:Pattern="Solid"/></Style></Styles>';
  for(const [name,rows] of Object.entries(chosen)){
    const cols=rows.length?Object.keys(rows[0]):['(kosong)'];
    xml+=`<Worksheet ss:Name="${yamEsc(name)}"><Table>`;
    xml+=`<Row>${cols.map(c=>`<Cell ss:StyleID="h"><Data ss:Type="String">${yamEsc(c)}</Data></Cell>`).join('')}</Row>`;
    rows.forEach(r=>{xml+=`<Row>${cols.map(c=>{const v=r[c];const isNum=typeof v==='number'||(!isNaN(v)&&v!==''&&c!=='kode'&&c!=='kodeAkun'&&c!=='kodeKas'&&c!=='kodeDebet'&&c!=='kodeKredit'&&c!=='noBukti'&&c!=='tanggal');return `<Cell><Data ss:Type="${isNum?'Number':'String'}">${yamEsc(v)}</Data></Cell>`}).join('')}</Row>`});
    xml+='</Table></Worksheet>';
  }
  xml+='</Workbook>';
  yamDL(new Blob([xml],{type:'application/vnd.ms-excel'}),`yamina-${mod.toLowerCase().replace(/ /g,'-')}-${new Date().toISOString().slice(0,10)}.xls`);
  yamMsg('✅ Excel (.xls, bisa dibuka di Excel / Google Sheets) berhasil diunduh. Untuk .xlsx murni, gunakan Export CSV lalu Save As .xlsx, atau impor file ini kembali.');
}
function yamExportCSV(){
  const mod=document.getElementById('yam-mod').value; const d=yamGet(); const sheets=yamSheets(d);
  if(mod==='Semua'){Object.entries(sheets).forEach(([n,rows])=>yamDL(new Blob([yamToCSV(rows)],{type:'text/csv'}),`yamina-${n.toLowerCase().replace(/ /g,'-')}.csv`));yamMsg('✅ Semua sheet CSV berhasil diunduh (satu file per modul).')}
  else{yamDL(new Blob([yamToCSV(sheets[mod])],{type:'text/csv'}),`yamina-${mod.toLowerCase().replace(/ /g,'-')}.csv`);yamMsg('✅ CSV '+mod+' berhasil diunduh.')}
}
function yamOpen(mode){
  const ov=document.getElementById('yam-overlay'); ov.classList.add('open');
  const card=document.getElementById('yam-card');
  if(mode==='export'){

async function yamDoImport(){
  const file=document.getElementById('yam-file').files[0];
  if(!file){yamMsg('⚠️ Pilih file dulu.');return}
  yamMsg('⏳ Memproses...');
  try{
    const d=yamGet(); const mod=document.getElementById('yam-imod').value; const mode=document.getElementById('yam-imode').value;
    let sheets={};
    if(file.name.toLowerCase().endsWith('.json')){
      const j=JSON.parse(await file.text());
      if(!j.coa){yamMsg('⚠️ File JSON bukan backup V3 yang valid.');return}
      if(!confirm('Timpa SEMUA data dengan backup JSON ini?'))return;
      yamSave({coa:j.coa,saldoAwal:j.saldoAwal||[],km:j.km||[],kk:j.kk||[],bu:j.bu||[],logs:j.logs||[]}); yamMsg('✅ Backup JSON dipulihkan. Memuat ulang...'); yamReload(); return;
    } else if(file.name.toLowerCase().endsWith('.csv')){
      sheets[mod==='auto'?'COA':mod]=yamParseCSV(await file.text());
    } else {
      await yamLoadXLSX();
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      wb.SheetNames.forEach(n=>{sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:'',raw:false})});
      // normalisasi header ke lowercase
      Object.keys(sheets).forEach(n=>{sheets[n]=sheets[n].map(r=>{const o={};Object.entries(r).forEach(([k,v])=>o[String(k).trim().toLowerCase()]=String(v??'').trim());return o})});
    }
    const num=v=>Number(String(v??'').replace(/[^0-9.-]/g,''))||0;
    const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    let added={};
    const apply=(key,rows,mapFn,dedupFn)=>{
      if(!rows?.length)return;
      if(mode==='replace') d[key]=[];
      d[key]=d[key]||[];
      rows.forEach(r=>{const item=mapFn(r); if(!item)return; if(mode==='add'&&d[key].some(x=>dedupFn(x,item)))return; d[key].push(item); added[key]=(added[key]||0)+1;});
    };
    const normKey=s=>s.toLowerCase().replace(/[^a-z]/g,'');
    for(const [sheet,rows] of Object.entries(sheets)){
      const k=normKey(sheet);
      const target = mod!=='auto'? mod : (k.includes('coa')?'COA':k.includes('saldo')?'Saldo Awal':k.includes('kasmasuk')?'Kas Masuk':k.includes('kaskeluar')?'Kas Keluar':k.includes('bukti')?'Bukti Umum':k.includes('jurnal')?'Bukti Umum':null);
      if(!target) continue;
      if(target==='COA') apply('coa',rows,r=>({kode:r.kode,nama:r.nama,kelompok:r.kelompok||'Aset Lancar',jenis:(r.jenis||'Debet'),kas:['ya','y','true','1','kas'].includes((r.kas||'').toLowerCase())}),(a,b)=>String(a.kode).toLowerCase()===String(b.kode).toLowerCase());
      if(target==='Saldo Awal') apply('saldoAwal',rows,r=>({id:uid(),kodeAkun:r.kodeakun||r.kode,kode:r.kodeakun||r.kode,debet:num(r.debet),kredit:num(r.kredit),keterangan:r.keterangan||''}),(a,b)=>a.kodeAkun===b.kodeAkun&&a.debet===b.debet&&a.kredit===b.kredit);
      if(target==='Kas Masuk') apply('km',rows,r=>({id:uid(),tanggal:r.tanggal,noBukti:r.nobukti,diterimaDari:r.diterimadari||r.diterima||'',noRM:r.norm||r.rm||'',uraian:r.uraian,kodeKas:r.kodekas,kodeAkun:r.kodeakun,jumlah:num(r.jumlah),metode:r.metode||'Tunai',petugas:r.petugas||'Admin'}),(a,b)=>a.noBukti===b.noBukti&&a.kodeAkun===b.kodeAkun);
      if(target==='Kas Keluar') apply('kk',rows,r=>({id:uid(),tanggal:r.tanggal,noBukti:r.nobukti,uraian:r.uraian,kodeKas:r.kodekas,kodeAkun:r.kodeakun,jumlah:num(r.jumlah)}),(a,b)=>a.noBukti===b.noBukti&&a.kodeAkun===b.kodeAkun);
      if(target==='Bukti Umum') apply('bu',rows,r=>({id:uid(),tanggal:r.tanggal,noBukti:r.nobukti,uraian:r.uraian,kodeDebet:r.kodedebet||r.kodedebit,kodeKredit:r.kodekredit,kodeKredit2:'',jumlah:num(r.jumlah)}),(a,b)=>a.noBukti===b.noBukti&&a.kodeDebet===b.kodeDebet);
    }
    if(!Object.keys(added).length){yamMsg('⚠️ Tidak ada baris valid yang diimpor. Cek nama sheet / header — unduh Template CSV untuk contoh yang benar.');return}
    if(d.coa) d.coa.sort((a,b)=>String(a.kode).localeCompare(String(b.kode)));
    yamSave(d);
    yamMsg('✅ Import berhasil: '+Object.entries(added).map(([k,v])=>k+': '+v+' baris').join(', ')+'. Memuat ulang...'); yamReload();
  }catch(e){yamMsg('❌ Gagal import: '+e.message)}
}

function yamTerbilang(n){
  n=Math.round(Number(n)||0);
  if(n===0) return 'Nol';
  if(n<0) return 'Minus '+yamTerbilang(-n);
  var satuan=['','Satu','Dua','Tiga','Empat','Lima','Enam','Tujuh','Delapan','Sembilan','Sepuluh','Sebelas'];
  if(n<12) return satuan[n];
  if(n<20) return yamTerbilang(n-10)+' Belas';
  if(n<100) return yamTerbilang(Math.floor(n/10))+' Puluh'+(n%10?' '+yamTerbilang(n%10):'');
  if(n<200) return 'Seratus'+(n%100?' '+yamTerbilang(n%100):'');
  if(n<1000) return yamTerbilang(Math.floor(n/100))+' Ratus'+(n%100?' '+yamTerbilang(n%100):'');
  if(n<2000) return 'Seribu'+(n%1000?' '+yamTerbilang(n%1000):'');
  if(n<1000000) return yamTerbilang(Math.floor(n/1000))+' Ribu'+(n%1000?' '+yamTerbilang(n%1000):'');
  if(n<1000000000) return yamTerbilang(Math.floor(n/1000000))+' Juta'+(n%1000000?' '+yamTerbilang(n%1000000):'');
  if(n<1000000000000) return yamTerbilang(Math.floor(n/1000000000))+' Miliar'+(n%1000000000?' '+yamTerbilang(n%1000000000):'');
  return yamTerbilang(Math.floor(n/1000000000000))+' Triliun'+(n%1000000000000?' '+yamTerbilang(n%1000000000000):'');
}

    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Metode</label><select id="yam-kw-metode"><option>Tunai</option><option>Transfer</option><option>QRIS</option><option>Kartu</option></select></div>'
    +'<div><label>Jumlah (Rp) — dari Kas Masuk</label><input value="'+yamKwitansiFmtRp(it.jumlah)+'" disabled style="background:#f6fbfb;font-weight:800"></div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Alamat Klinik <span style="font-weight:400">(opsional, tersimpan)</span></label><input id="yam-kw-alamat" value="'+yamEsc(h.alamat||'')+'" placeholder="Isi sekali, dipakai untuk kwitansi berikutnya"></div>'
    +'<div><label>Telp Klinik <span style="font-weight:400">(opsional)</span></label><input id="yam-kw-telp" value="'+yamEsc(h.telp||'')+'" placeholder="cth: (0271) xxxxxx"></div></div>'
    +'<label style="margin-top:16px">Pratinjau Kwitansi</label><div id="yam-kw-preview" class="yam-kw-preview" style="margin-top:4px"></div>'
    +'<div id="yam-kw-save-status" style="margin-top:10px;font-size:12px;color:#047857;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:8px 10px">✅ Edit di sini tersimpan otomatis ke Kas Masuk.</div>'
    +'<div class="row"><button style="background:#0d9488;color:#fff" onclick="yamKwitansiPrint()">🖨️ Cetak Kwitansi</button><button style="background:#18181b;color:#fff" onclick="yamKwitansiClose()">Tutup</button></div>'
    +'<div id="yam-msg" style="font-size:12px;color:#52525b">Tip: kertas A5 (148 × 210 mm) paling pas untuk 1 kwitansi. Di jendela cetak, matikan Headers &amp; footers agar bersih.</div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov) yamKwitansiClose()});
  var mSel=document.getElementById('yam-kw-metode'); if(mSel){var opts=Array.prototype.slice.call(mSel.options); var found=opts.some(function(o){return o.value===it.metode}); if(!found && it.metode){var o2=document.createElement('option'); o2.value=it.metode; o2.text=it.metode; mSel.appendChild(o2);} mSel.value=it.metode;}
  ['yam-kw-nama','yam-kw-rm','yam-kw-uraian','yam-kw-metode','yam-kw-petugas'].forEach(function(id){
    var el=document.getElementById(id); if(el){ el.addEventListener('input',function(){yamKwitansiRender(); yamKwitansiAutoSaveSoon();}); el.addEventListener('change',function(){yamKwitansiRender(); yamKwitansiAutoSaveSoon();}); }
  });
  ['yam-kw-alamat','yam-kw-telp'].forEach(function(id){
    var el=document.getElementById(id); if(el) el.addEventListener('input',yamKwitansiRender);
  });
  yamKwitansiRender();
}

    +'<div class="title">KWITANSI PEMBAYARAN PASIEN</div><div class="noku">No. Kwitansi: <b style="font-family:monospace">'+yamEsc(k.noBukti)+'</b></div>'
    +'<div class="row"><span class="lbl">Tanggal</span><span>: '+yamEsc(yamKwitansiFmtTgl(k.tanggal))+'</span></div>'
